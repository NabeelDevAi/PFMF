[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's own documented idiom is `param: T = Depends(...)` in a
# route's default arguments -- not the antipattern this rule otherwise
# correctly catches.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
